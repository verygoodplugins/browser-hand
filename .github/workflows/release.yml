name: Release

# Tags come from Release Please as browser-hand-vX.Y.Z. Bare v* tags in this
# repo are extension releases and older release candidates, not this package.
on:
  push:
    tags:
      - "browser-hand-v*"

jobs:
  release-plan:
    name: Decide publish path
    runs-on: ubuntu-latest
    outputs:
      publish_npm: ${{ steps.check.outputs.publish_npm }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        env:
          PUBLISH_NPM: ${{ vars.PUBLISH_NPM }}
        run: |
          tag="${GITHUB_REF_NAME#browser-hand-v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" = "$pkg" ] && [ "$PUBLISH_NPM" = "true" ]; then
            echo "publish_npm=true" >> "$GITHUB_OUTPUT"
            echo "Tag browser-hand-v$tag matches package.json and PUBLISH_NPM=true. Publishing the headless package."
          else
            echo "publish_npm=false" >> "$GITHUB_OUTPUT"
            echo "Skipping npm publish and the binary build. Set the PUBLISH_NPM repository variable to true when the package is ready."
          fi

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release when Release Please has not
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --generate-notes

  build-daemon:
    name: Build Daemon Bundles
    needs: release-plan
    if: needs.release-plan.outputs.publish_npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cd daemon && pnpm install
      - run: cd daemon && pnpm run bundle
      - run: cd daemon && pnpm run bundle:sandbox-client
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-bundles
          path: |
            daemon/dist/daemon.bundle.mjs
            daemon/dist/sandbox-client.js

  build-binaries:
    needs: build-daemon
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: dev-browser-darwin-arm64
            source_binary: dev-browser
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: dev-browser-darwin-x64
            source_binary: dev-browser
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: dev-browser-linux-x64
            source_binary: dev-browser
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: dev-browser-linux-arm64
            cross: true
            source_binary: dev-browser
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: dev-browser-linux-musl-x64
            cross: true
            source_binary: dev-browser
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: dev-browser-windows-x64.exe
            source_binary: dev-browser.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: daemon-bundles
          path: daemon/dist/
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross (if needed)
        if: matrix.cross
        run: cargo install cross
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --manifest-path cli/Cargo.toml
          else
            cargo build --release --target ${{ matrix.target }} --manifest-path cli/Cargo.toml
          fi
      - name: Rename binary
        shell: bash
        run: cp cli/target/${{ matrix.target }}/release/${{ matrix.source_binary }} ${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  publish:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm trusted publishing (OIDC); also enables provenance.
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing requires npm >= 11.5.1; node 22 ships an older npm.
      - run: npm install -g npm@latest
      - run: cd daemon && pnpm install && pnpm run bundle && pnpm run bundle:sandbox-client
      - run: |
          mkdir -p dist/bin dist/scripts dist/daemon/dist
          cp bin/dev-browser.js dist/bin/
          cp scripts/postinstall.js dist/scripts/
          cp scripts/sync-version.js dist/scripts/ 2>/dev/null || true
          cp daemon/dist/daemon.bundle.mjs dist/daemon/dist/
          cp daemon/dist/sandbox-client.js dist/daemon/dist/
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            delete pkg.private;
            delete pkg.workspaces;
            writeFileSync("dist/package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          cp README.md dist/
          cp LICENSE dist/ 2>/dev/null || true
      # No NODE_AUTH_TOKEN: auth comes from the OIDC trusted publisher config.
      - run: cd dist && npm publish
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: false
