name: Bug report
description: Report a reproducible bug
labels: ["bug"]
body:
  - type: dropdown
    id: path
    attributes:
      label: Which path?
      description: Browser Hand product default is the extension bridge.
      options:
        - Extension + relay (`browser-hand` CLI)
        - Upstream headless (`dev-browser` binary)
        - Skill / docs only
        - Unsure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimum steps that reliably trigger the bug.
      placeholder: |
        1. npm run relay
        2. browser-hand doctor
        3. browser-hand open --url … --page-name demo
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: textarea
    id: doctor
    attributes:
      label: `browser-hand doctor` output (extension path)
      description: Paste JSON if relevant. Redact secrets.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Package / commit
      placeholder: e.g. 0.2.9 or git SHA
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: e.g. v22.14.0
    validations:
      required: false
  - type: input
    id: chrome
    attributes:
      label: Chrome version (extension path)
      placeholder: e.g. 138.0.x
    validations:
      required: false
