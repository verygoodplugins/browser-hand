<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Hand</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="popup">
      <header class="popup-header">
        <img
          id="popup-mark"
          class="popup-mark"
          src="/icons/icon-48.png"
          width="32"
          height="32"
          alt=""
        />
        <h1>Browser Hand</h1>
      </header>
      <div class="toggle-row">
        <label class="toggle">
          <input type="checkbox" id="active-toggle" />
          <span class="slider"></span>
        </label>
        <span id="status-text">Inactive</span>
      </div>
      <p id="connection-status" class="connection-status"></p>

      <label class="field-label" for="focus-policy">Focus while automating</label>
      <select id="focus-policy" class="focus-select">
        <option value="background">Background (default)</option>
        <option value="tab">Activate tab only</option>
        <option value="window">Focus Chrome window</option>
      </select>
      <p class="hint" id="focus-hint">Agents keep working without stealing your keyboard focus.</p>

      <label class="field-label" for="transport-mode">Page control</label>
      <select id="transport-mode" class="focus-select">
        <option value="scripting">Debugger-free (default)</option>
        <option value="debugger">Chrome debugger (CDP)</option>
      </select>
      <p class="hint" id="transport-hint"></p>

      <div class="account-row">
        <div class="account-identity">
          <img id="account-avatar" class="account-avatar" alt="" hidden />
          <div>
            <div id="account-name" class="account-name">Not signed in</div>
            <div id="account-email" class="account-email">Account and orders</div>
          </div>
        </div>
        <button id="open-account" class="account-button" type="button">Sign in</button>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
